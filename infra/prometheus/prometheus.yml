global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Works for both host dev (pnpm dev:api) and the dockerized api service,
  # since the api container publishes 3001 and Prometheus runs on the host
  # network (see docker-compose.yml).
  - job_name: 'pullquest-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['localhost:3001']
