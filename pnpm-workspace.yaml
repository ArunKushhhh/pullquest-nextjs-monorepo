packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
# Workaround: npm registry metadata lags — webpack 5.109.2 asks for
# enhanced-resolve ^5.24.4 which is not published yet (latest 5.24.3).
overrides:
  "enhanced-resolve@^5.24.4": 5.24.3
